name: Build & Publish add-on image

on:
  push:
    branches: [main]
    # No tag trigger: a Release (and its tag) is created after this workflow
    # has built and pushed the version, so a tag push must not rebuild it.
    paths:
      - config.yaml
      - build.yaml
      - Dockerfile
      - rootfs/**
      - patches/**
      - .github/workflows/build.yml
  # Also on PRs, so verify-hashes and the two guards below actually gate a
  # change. Without this the whole job only ran AFTER a merge to main —
  # which is exactly how the /home/coder comments and the never-invoked
  # patch script got in.
  # PRs run unfiltered so the ruleset's required checks always report (release-gating #88).
  pull_request:
  workflow_dispatch:
    inputs:
      push:
        description: Push image to GHCR (false = build-only sanity check)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-hashes:
    name: Verify shared-file hashes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check rootfs files against rootfs/opt/SHA256SUMS
        # rootfs/opt/SHA256SUMS records absolute in-image paths (checked
        # again inside the Dockerfile build itself). Here, before the image
        # build, the same hashes are checked against the source files in
        # rootfs/ on the runner — this is the check that catches a PR
        # editing pi-code/pi.sh/pi-seed without updating the published
        # hash. Source of truth for these three files is
        # Woow_podman_code_server_package; a change there must land here
        # in the same PR set (see PARITY_CONTRACT.md).
        run: |
          set -e
          while read -r hash path; do
            [ -n "${hash}" ] || continue
            actual="$(sha256sum "rootfs${path}" | cut -d' ' -f1)"
            if [ "${actual}" != "${hash}" ]; then
              echo "MISMATCH: rootfs${path} expected ${hash} got ${actual}" >&2
              exit 1
            fi
            echo "OK: rootfs${path}"
          done < rootfs/opt/SHA256SUMS

      - name: No /home/coder references (this image has no such user)
        # The shared files here are vendored from
        # Woow_podman_code_server_package, whose login user IS coder. A
        # verbatim copy of a comment mentioning /home/coder was shipped in
        # this add-on and sent a debugging session down the wrong path: the
        # login user here is root, and the ~/.pi symlink the comment
        # described is created at runtime by init-woow, not by the image
        # build. tests/lib/parity.sh is exempt — it is a multi-target
        # adapter and names all three deployments' paths on purpose.
        run: |
          set -e
          if grep -rn '/home/coder' Dockerfile rootfs/ patches/ 2>/dev/null; then
            echo "" >&2
            echo "Found /home/coder above. This image runs as root and has no" >&2
            echo "coder user; a path or comment was copied from the podman" >&2
            echo "package without adapting it. Shared files (pi-code, pi.sh)" >&2
            echo "must be written platform-neutrally in ALL THREE repos." >&2
            exit 1
          fi
          echo "OK: no /home/coder references"

      - name: Unicode-space patch is wired into the build
        # The F1 incident was not a broken patch script — it was a patch
        # script that existed and was never invoked. Assert the Dockerfile
        # actually calls it, so deleting the RUN line fails CI rather than
        # silently shipping the corruption again.
        run: |
          set -e
          grep -q 'fix-unicode-space-paths.mjs' Dockerfile
          grep -q 'f1-verify.mjs' Dockerfile
          echo "OK: patch + verifier are invoked by the build"

  # A version with a Release is what the App Store ships (registry
  # ref_policy: release), so its image is never rebuilt under the same tag.
  # Pushes that do not bump config.yaml therefore build only on PRs; the next
  # version bump builds, checks and releases them.
  released:
    name: Check whether this version is released
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Look up the Release for config.yaml's version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(yq -r '.version' config.yaml)"
          # Only "not found" means unreleased; any other lookup failure stops
          # the run rather than overwrite a shipped image.
          if out="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${version}" 2>&1)"; then
            echo "::notice::This version is already released; its image is not rebuilt"
            echo "released=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' <<< "${out}"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not look up the Release for this version" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.arch }})
    needs: [verify-hashes, released]
    if: github.event_name == 'pull_request' || needs.released.outputs.released != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on metadata
        id: meta
        run: |
          {
            echo "name=$(yq '.name' config.yaml)"
            echo "description=$(yq '.description' config.yaml)"
            echo "version=$(yq '.version' config.yaml)"
            echo "base_image=$(yq '.build_from.${{ matrix.arch }}' build.yaml)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
          # A PR keeps its amd64 image in the local docker daemon for the
          # upgrade comparison's SBOM step below.
          load: ${{ github.event_name == 'pull_request' && matrix.arch == 'amd64' }}
          provenance: false
          tags: |
            ghcr.io/woowtech/woow-ha-code-server-${{ matrix.arch }}:${{ steps.meta.outputs.version }}
            ghcr.io/woowtech/woow-ha-code-server-${{ matrix.arch }}:latest
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.base_image }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            BUILD_DESCRIPTION=${{ steps.meta.outputs.description }}
            BUILD_NAME=${{ steps.meta.outputs.name }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      # The SBOM of this image is what the Upgrade comparison scans as the
      # new version (pipeline #89, category 4): pinned Syft from the Store,
      # uploaded as artifact upgrade-comparison-sbom-woow_ha_code_server.
      # The PR build reads the same gha cache scope as the main build that
      # ships (PRs can read main's cache, main never reads a PR's), so the
      # SBOM is of the layers the Release build reuses.
      - name: SBOM for the upgrade comparison
        if: github.event_name == 'pull_request' && matrix.arch == 'amd64'
        uses: WOOWTECH/Woow_HA_App_Store/.github/actions/addon-sbom@feat/89-upgrade-comparison
        with:
          component: woow_ha_code_server
          image: ghcr.io/woowtech/woow-ha-code-server-amd64:${{ steps.meta.outputs.version }}

  # Upgrade comparison (pipeline #89): a PR that bumps the add-on version is
  # compared with the latest formal Release. A breaking config.yaml change
  # not declared in upgrade-notes.yaml blocks it, and so does a new fixable
  # Critical/High vulnerability in the amd64 image (the SBOM from
  # Build (amd64) against the Release's GHCR image) unless that file accepts
  # it. No needs: on the build, so a PR that changes no version passes in
  # seconds; after a version bump the job waits for this run's SBOM artifact
  # (actions: read) and fails if Build (amd64) never uploads it. On push the
  # job passes at once, so this workflow's non-PR run (registry
  # required_workflows) still succeeds. Reported as "Upgrade comparison / compare".
  upgrade-comparison:
    name: Upgrade comparison
    permissions:
      contents: read
      actions: read
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-upgrade-check.yml@feat/89-upgrade-comparison
    with:
      tooling_ref: feat/89-upgrade-comparison
      sbom_artifact: upgrade-comparison-sbom-*

  # Both architecture images are pushed: publish the Release the App Store
  # ships. The shared workflow tags v<version> and skips a released version.
  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-release.yml@main
